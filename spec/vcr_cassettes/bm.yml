        />\r\n            </svg>\r\n        </div>\r\n    </header>\r\n    <div class=\"accordion__content\">\r\n
        \       <div><p><p style=\"text-align: justify;\">O Banco de Moçambique (BM)
        intervém no mercado cambial através da compra ou venda, no Mercado Cambial
        Interbancário, do Dólar dos Estados Unidos da América (USD), em troca da moeda
        nacional, o Metical.</p>\n<p style=\"text-align: justify;\">Esta intervenção,
        aprovada pelo Conselho de Administração do BM, é consistente com o quadro
        de política monetária, que visa a preservação do valor da moeda nacional,
        num contexto de regime de taxa de câmbio flutuante.</p>\n<p style=\"text-align:
        justify;\">No regime de taxa de câmbio flutuante, os bancos cotam as taxas
        de câmbio a vigorarem em cada momento, de acordo com as condições do mercado,
        onde a procura e a oferta de divisas, presentes e prospectivas, jogam um papel
        fundamental.</p></p></div>\r\n    </div>\r\n</article>\r\n\r\n<article class=\"accordion__article\">\r\n
        \   <header class=\"accordion__header\">\r\n        <h4 class=\"accordion__title\"><p><strong>Objectivos</strong></p></h4>\r\n
        \       <div class=\"accordion__icon\">\r\n            <svg width=\"14\" height=\"14\"
        viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n
        \               <line x1=\"7.125\" y1=\"1\" x2=\"7.125\" y2=\"13\" stroke=\"#012D5C\"
        stroke-width=\"2\" stroke-linecap=\"round\" />\r\n                <line x1=\"13\"
        y1=\"7.125\" x2=\"1\" y2=\"7.125\" stroke=\"#012D5C\" stroke-width=\"2\" stroke-linecap=\"round\"
        />\r\n            </svg>\r\n        </div>\r\n    </header>\r\n    <div class=\"accordion__content\">\r\n
        \       <div><p><p style=\"text-align: justify;\">A intervenção do BM no mercado
        cambial visa:</p>\n<ol>\n<li style=\"text-align: justify;\">Colmatar condições
        “desordeiras” do mercado, que resultam de desequilíbrios notáveis entre a
        procura e a oferta de divisas no mercado, e que impactam significativamente
        na volatilidade da taxa de câmbio; e</li>\n<li style=\"text-align: justify;\">Acumular
        e manter um <em>stock</em> adequado de reservas internacionais para assegurar
        o cumprimento dos compromissos do país com o exterior e preservar a confiança
        dos mercados na moeda nacional.</li>\n</ol></p></div>\r\n    </div>\r\n</article>\r\n\r\n<article
        class=\"accordion__article\">\r\n    <header class=\"accordion__header\">\r\n
