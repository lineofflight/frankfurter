        y1=\"7.125\" x2=\"1\" y2=\"7.125\" stroke=\"#012D5C\" stroke-width=\"2\" stroke-linecap=\"round\"
        />\r\n            </svg>\r\n        </div>\r\n    </header>\r\n    <div class=\"accordion__content\">\r\n
        \       <div><p><p style=\"text-align: justify;\">O BM pode comunicar previamente
        as datas e os montantes de intervenção, para colmatar condições “desordeiras”
        no mercado, bem como acumular e manter um <em>stock </em>adequado de reservas
        internacionais.</p>\n<p style=\"text-align: justify;\">O BM comunica, ainda,
        os resultados das intervenções no Mercado Cambial Interbancário.</p></p></div>\r\n
