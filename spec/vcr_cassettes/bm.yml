        Interven&#231;&#227;o do Banco de Mo&#231;ambique no MCI</h2>\r\n        </div>\r\n\r\n\r\n<div
        class=\"accordion\">\r\n    <h3 class=\"t-xl accordion__headline\"></h3>\r\n\r\n\r\n\r\n\r\n<article
        class=\"accordion__article\">\r\n    <header class=\"accordion__header\">\r\n
        \       <h4 class=\"accordion__title\"><p><strong>Enquadramento</strong></p></h4>\r\n
        \       <div class=\"accordion__icon\">\r\n            <svg width=\"14\" height=\"14\"
        viewBox=\"0 0 14 14\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\r\n
        \               <line x1=\"7.125\" y1=\"1\" x2=\"7.125\" y2=\"13\" stroke=\"#012D5C\"
