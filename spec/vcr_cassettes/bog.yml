        {color: #ffffff;border-color: #4173f2;background-color: #4173f2;}/* #Comment
        Reply Link */#cancel-comment-reply-link {color: #ebbd3f;}#cancel-comment-reply-link:hover
        {color: #ebbd3f;}/* #Comment item */.comment-body .fn {font-style: normal;font-weight:
        500;font-size: 14px;line-height: 1.5;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;color: #19324c;}.comment-date__time {color: #b0aebe;}.comment-reply-link
        {font-style: normal;font-weight: 900;font-size: 11px;line-height: 1;font-family:
        'IBM Plex Sans', sans-serif;letter-spacing: 1px;}/* #Input Placeholders */::-webkit-input-placeholder
        { color: #b0aebe; }::-moz-placeholder{ color: #b0aebe; }:-moz-placeholder{
        color: #b0aebe; }:-ms-input-placeholder{ color: #b0aebe; }/* #Entry Meta */.posted-on,.cat-links,.byline,.tags-links
        {color: #b0aebe;}.comments-button {color: #b0aebe;}.comments-button:hover
