        .entry-meta,.invert-hover.has-post-thumbnail:hover a,.invert-hover.has-post-thumbnail:hover
        .btn-icon,.invert-item.has-post-thumbnail,.invert-item.has-post-thumbnail
        .posted-on,.invert-item.has-post-thumbnail .cat-links,.invert-item.has-post-thumbnail
        .byline,.invert-item.has-post-thumbnail .tags-links,.invert-item.has-post-thumbnail
        .entry-meta,.invert-item.has-post-thumbnail a,.invert-item.has-post-thumbnail
        .btn:hover,.invert-item.has-post-thumbnail .btn-style .post-categories a:hover,.invert,.invert
        .entry-title,.invert a,.invert .byline,.invert .posted-on,.invert .cat-links,.invert
        .tags-links {color: #ffffff;}.invert-hover.has-post-thumbnail:hover a:hover,.invert-hover.has-post-thumbnail:hover
        .btn-icon:hover,.invert-item.has-post-thumbnail a:hover,.invert a:hover {color:
        #ebbd3f;}.invert-hover.has-post-thumbnail .btn,.invert-item.has-post-thumbnail
        .comments-button,.posts-list--default.list-style-v10 .invert.default-item
        .comments-button{color: #ffffff;background-color: #4173f2;}.invert-hover.has-post-thumbnail
        .btn:hover,.invert-item.has-post-thumbnail .comments-button:hover,.posts-list--default.list-style-v10
