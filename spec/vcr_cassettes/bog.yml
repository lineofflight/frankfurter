        type='text/css'>\n/* #Typography */body {font-style: normal;font-weight: 300;font-size:
        14px;line-height: 1.6;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: left;color: #32316b;}h1,.h1-style {font-style: normal;font-weight:
        400;font-size: 34px;line-height: 1.4;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}h2,.h2-style {font-style: normal;font-weight:
        400;font-size: 24px;line-height: 1.4;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}h3,.h3-style {font-style: normal;font-weight:
        400;font-size: 21px;line-height: 1.4;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}h4,.h4-style {font-style: normal;font-weight:
        400;font-size: 20px;line-height: 1.5;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}h5,.h5-style {font-style: normal;font-weight:
        300;font-size: 18px;line-height: 1.5;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}h6,.h6-style {font-style: normal;font-weight:
        500;font-size: 14px;line-height: 1.5;font-family: 'IBM Plex Sans', sans-serif;letter-spacing:
        0px;text-align: inherit;color: #19324c;}@media (min-width: 1200px) {h1,.h1-style
        { font-size: 56px; }h2,.h2-style { font-size: 40px; }h3,.h3-style { font-size:
        28px; }}a,h1 a:hover,h2 a:hover,h3 a:hover,h4 a:hover,h5 a:hover,h6 a:hover
        { color: #ebbd3f; }a:hover { color: #ebbd3f; }blockquote {color: #4173f2;}/*
        #Header */.site-header__wrap {background-color: #ffffff;background-repeat:
        repeat;background-position: center top;background-attachment: scroll;;}/*
        ##Top Panel */.top-panel {color: #b0aebe;background-color: #ffffff;}/* #Main
        Menu */.main-navigation {font-style: normal;font-weight: 400;font-size: 14px;line-height:
        1.4;font-family: Cabin, sans-serif;letter-spacing: 0px;}.main-navigation a,.menu-item-has-children:before
        {color: #b0aebe;}.main-navigation a:hover,.main-navigation .current_page_item>a,.main-navigation
        .current-menu-item>a,.main-navigation .current_page_ancestor>a,.main-navigation
        .current-menu-ancestor>a {color: #ebbd3f;}/* #Mobile Menu */.mobile-menu-toggle-button
        {color: #ffffff;background-color: #4173f2;}/* #Social */.social-list a {color:
        #b0aebe;}.social-list a:hover {color: #4173f2;}/* #Breadcrumbs */.breadcrumbs_item
        {font-style: normal;font-weight: 400;font-size: 11px;line-height: 1.5;font-family:
        'IBM Plex Sans', sans-serif;letter-spacing: 0px;}.breadcrumbs_item_sep,.breadcrumbs_item_link
        {color: #b0aebe;}.breadcrumbs_item_link:hover {color: #4173f2;}/* #Post navigation
        */.post-navigation i {color: #b0aebe;}.post-navigation .nav-links a:hover
        .post-title,.post-navigation .nav-links a:hover .nav-text {color: #ebbd3f;}.post-navigation
        .nav-links a:hover i {color: #ebbd3f;}/* #Pagination */.pagination .page-numbers,.page-links
        > span,.page-links > a {color: #b0aebe;}.pagination a.page-numbers:hover,.pagination
        .page-numbers.current,.page-links > a:hover,.page-links > span {color: #ebbd3f;}.pagination
        .next,.pagination .prev {color: #ebbd3f;}.pagination .next:hover,.pagination
        .prev:hover {color: #ebbd3f;}/* #Button Appearance Styles (regular scheme)
        */.btn,button,input[type='button'],input[type='reset'],input[type='submit']
        {font-style: normal;font-weight: 900;font-size: 11px;line-height: 1;font-family:
        'IBM Plex Sans', sans-serif;letter-spacing: 1px;color: #ffffff;background-color:
        #4173f2;}.btn:hover,button:hover,input[type='button']:hover,input[type='reset']:hover,input[type='submit']:hover,input[type='reset']:hover
        {color: #ffffff;background-color: rgb(103,153,255);}.btn.invert-button {color:
        #ffffff;}.btn.invert-button:hover {color: #ffffff;border-color: #4173f2;background-color:
        #4173f2;}input,optgroup,select,textarea {font-size: 14px;}/* #Comment, Contact,
        Password Forms */.comment-form .submit,.wpcf7-submit,.post-password-form label
        + input {font-style: normal;font-weight: 900;font-size: 11px;line-height:
        1;font-family: 'IBM Plex Sans', sans-serif;letter-spacing: 1px;color: #ffffff;background-color:
        #4173f2;}.comment-form .submit:hover,.wpcf7-submit:hover,.post-password-form
        label + input:hover {color: #ffffff;background-color: rgb(103,153,255);}.comment-reply-title
