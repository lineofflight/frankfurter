# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "bundler" # See documentation for possible values
    directory: "/" # Location of package manifests
    assignees:
      - "hakanensari"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    assignees:
      - "hakanensari"
    schedule:
      interval: "weekly"
  # Actions are pinned by SHA, so every patch and minor now opens a PR instead
  # of landing silently behind a floating tag. Group them into one weekly PR,
  # and hold a release for a week before proposing it: auto-merge approves
  # non-major bumps unattended, and tag-hijack compromises are usually caught
  # within days.
  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "hakanensari"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
