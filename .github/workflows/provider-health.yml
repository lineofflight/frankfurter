name: Provider health

# Daily audit for silently-frozen providers. Reads the live /v2/providers feed,
# flags any provider whose publishes_missed exceeds its cadence threshold, and
# upserts a single rolling issue (labels: provider + health). See bin/provider_health.rb.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      - run: ruby bin/provider_health.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
