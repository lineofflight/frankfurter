name: Provider health

# Daily audit for silently-frozen providers and unknown currency codes. Reads the live /v2/providers feed,
# flags missed publishes beyond the cadence threshold or codes excluded from the catalogue, and
# upserts a single rolling issue (labels: provider + health). See bin/provider_health.rb.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
      - run: ruby bin/provider_health.rb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
