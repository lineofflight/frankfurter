var $this = $(this);\r\n            var $nav = $(\".nav\");\r\n\r\n            $this.toggleClass(\"active\");\r\n            $nav.toggle();\r\n        });\r\n    }\r\n\r\n    $(document).ready(function() {\r\n        // Initialize width after DOM is ready\r\n        ww = document.body.clientWidth || window.innerWidth;\r\n\r\n        $(\".nav li a\").each(function() {\r\n            if ($(this).next().length > 0 && $(this).next().is('ul')) {\r\n                $(this).addClass(\"parent\");\r\n            }\r\n        });\r\n\r\n        // Attach the handler\r\n        attachToggleHandler();\r\n\r\n        adjustMenu();\r\n\r\n        // Re-attach after adjustMenu\r\n        setTimeout(function() {\r\n            attachToggleHandler();\r\n        }, 100);\r\n    });\r\n\r\n    $(window).bind(\"resize orientationchange\", function() {\r\n        ww = document.body.clientWidth || window.innerWidth;\r\n        adjustMenu();\r\n\r\n        // Re-attach handler after resize\r\n        setTimeout(attachToggleHandler, 50);\r\n    });\r\n\r\n    var adjustMenu = function() {\r\n        if (ww < 780) {\r\n            // Show the responsive menu container on mobile\r\n            $(\".responsive-menu\").css({\r\n                \"display\": \"block\",\r\n                \"position\": \"relative\",\r\n                \"z-index\": \"9999\",\r\n                \"width\": \"100%\"\r\n            });\r\n\r\n            $(\".toggleMenu\").css({\r\n                \"display\": \"inline-block\",\r\n                \"position\": \"relative\",\r\n                \"z-index\": \"10000\",\r\n                \"cursor\": \"pointer\"\r\n            });\r\n\r\n            // Ensure nav is properly positioned for mobile\r\n            $(\".nav\").css({\r\n                \"position\": \"relative\",\r\n                \"width\": \"100%\",\r\n                \"left\": \"0\",\r\n                \"top\": \"0\",\r\n                \"z-index\": \"9998\",\r\n                \"background\": \"#D18987\",\r\n                \"margin\": \"0\",\r\n                \"padding\": \"0\"\r\n            });\r\n\r\n            // Only set initial state, don't override if user has toggled\r\n            if (!$(\".toggleMenu\").hasClass(\"active\")) {\r\n                $(\".nav\").hide();\r\n            } else {\r\n                $(\".nav\").show();\r\n            }\r\n\r\n            // remove desktop hover behavior\r\n            $(\".nav li\").off('mouseenter mouseleave');\r\n\r\n            // Fix submenu positioning for mobile - ensure they're hidden by default\r\n            $(\".nav li ul\").css({\r\n                \"position\": \"static\",\r\n                \"left\": \"auto\",\r\n                \"width\": \"100%\",\r\n                \"display\": \"none\"\r\n            });\r\n\r\n            // Ensure nav li elements are full width\r\n            $(\".nav > li\").css({\r\n                \"float\": \"none\",\r\n                \"width\": \"100%\",\r\n                \"display\": \"block\"\r\n            });\r\n\r\n            // Ensure nested li elements are also full width\r\n            $(\".nav li li\").css({\r\n                \"float\": \"none\",\r\n                \"width\": \"100%\",\r\n                \"display\": \"block\"\r\n            });\r\n\r\n            // Handle ALL levels of dropdowns (even nested ones)\r\n            $(\".nav li a\").off('click').on('click', function(e) {\r\n                const $next = $(this).next('ul');\r\n                if ($next.length > 0) {\r\n                    // this link has a submenu\r\n                    e.preventDefault();\r\n                    e.stopPropagation();\r\n                    var $parentLi = $(this).parent(\"li\");\r\n                    $parentLi.toggleClass(\"hover\");\r\n\r\n                    // Show/hide the submenu\r\n                    var isHover = $parentLi.hasClass(\"hover\");\r\n                    if (isHover) {\r\n                        $next.slideDown(200);\r\n                    } else {\r\n                        $next.slideUp(200);\r\n                    }\r\n                }\r\n            });\r\n        } else if (ww >= 780) {\r\n            // Hide responsive menu on desktop\r\n            $(\".responsive-menu\").css(\"display\", \"none\");\r\n            $(\".toggleMenu\").css(\"display\", \"none\");\r\n            $(\".nav\").show();\r\n            $(\".nav li\").removeClass(\"hover\");\r\n            $(\".nav li a\").off('click');\r\n\r\n            // restore hover on desktop\r\n            $(\".nav li\").off('mouseenter mouseleave').on('mouseenter mouseleave', function() {\r\n                $(this).toggleClass('hover');\r\n            });\r\n        }\r\n    }\r\n</script>\r\n\r\n<div class=\"responsive-menu\">\r\n    <a class=\"toggleMenu\" href=\"#\">\r\n        <img src=\"../../images/menu.svg\" style=\"width:60px;height:35px;\" border=\"0\"></a>\r\n    <ul class=\"nav\">\r\n        <li>\r\n            <a href=\"../index.php\">\r\n                <img src=\"../../images/home.svg\" style=\"width:15px;height:15px;\" border=\"0\"></a>\r\n        </li>\r\n        <li>\r\n            <a href=\"../about_the_bank/overview_of_functions_and_operation.php\">About</a>\r\n            <ul>\r\n                <li>\r\n                    <a href=\"../about_the_bank/overview_of_functions_and_operation.php\">Overview</a>\r\n                </li>\r\n                <li class='has-sub'>\r\n                    <a href=\"../about_the_bank/structure_of_nbc.php\">Organization</a>\r\n                    <ul>\r\n                        <li><a href=\"../about_the_bank/structure_of_nbc.php\">Structure</a></li>\r\n                        <li><a href=\"../about_the_bank/board_of_directors.php\">Board of Directors</a></li>\r\n                        <li><a href=\"../about_the_bank/nbc_branch.php\">Branches</a></li>\r\n                    </ul>\r\n                </li>\r\n                <li>\r\n                    <a href=\"../about_the_bank/history_of_nbc